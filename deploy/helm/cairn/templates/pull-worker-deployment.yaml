{{- if .Values.pullWorker.enabled }}
{{/*
`cairn worker --pull` (#565): a machine that dials OUT. It claims work from the
control plane, runs the image, and reports over the job channel. No inbound
access.

`pullWorker.command` is required and has no default (_helpers.tpl refuses an
empty one), e.g. ["cairn", "worker", "--pull", "--engine-url", "https://<host>"].
With auth on, claiming needs a worker-pool token (`cairn remote worker-token
--name <pool>`) in CAIRN_ENGINE_TOKEN. The worker reads it from a Secret of its
OWN (pullWorker.token, rendered below, or pullWorker.existingSecret) and no longer
reads the control plane's Secret. It still reads the shared ConfigMap, which
carries the database DSN (with its password, for the bundled Postgres), the OTEL
headers and env.extra, and it runs under the release's ServiceAccount.
*/}}
{{- if not (trim (toString (default "" .Values.pullWorker.existingSecret))) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cairn.pullWorkerSecretName" . }}
  labels:
    {{- include "cairn.labels" . | nindent 4 }}
    app.kubernetes.io/component: pull-worker
type: Opaque
stringData:
  # A worker-pool token: it may claim and report pull-lane jobs, nothing else.
  CAIRN_ENGINE_TOKEN: {{ include "cairn.pullWorkerToken" . | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cairn.fullname" . }}-pull-worker
  labels:
    {{- include "cairn.labels" . | nindent 4 }}
    app.kubernetes.io/component: pull-worker
spec:
  replicas: {{ .Values.pullWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "cairn.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: pull-worker
  template:
    metadata:
      labels:
        {{- include "cairn.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pull-worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not (trim (toString (default "" .Values.pullWorker.existingSecret))) }}
        # a rotated pullWorker.token restarts the worker (an existingSecret's does not)
        checksum/token: {{ include "cairn.pullWorkerToken" . | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "cairn.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pull-worker
          image: {{ include "cairn.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.pullWorker.command | nindent 12 }}
          envFrom:
            {{- include "cairn.pullWorkerEnvFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.pullWorker.resources | nindent 12 }}
      {{- with .Values.pullWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pullWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pullWorker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
